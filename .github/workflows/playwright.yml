name: Playwright Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test-chromium:
    name: 'Chromium Tests'
    runs-on: ubuntu-latest
    # 15 minutes was not enough: the Firefox job spent the whole budget inside
    # "npx playwright install --with-deps firefox" - a download - and was killed
    # before a single test ran. Chromium and WebKit finish the same step in about
    # a minute, so the limit only ever cut off the slow browser.
    timeout-minutes: 30
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '22'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Install Playwright browsers
      run: npx playwright install --with-deps chromium
    
    - name: Run Playwright tests on Chromium
      run: npm run test:chromium
      env:
        CI: true
    
    - name: Test summary
      if: always()
      run: echo "Chromium tests completed"

  test-firefox:
