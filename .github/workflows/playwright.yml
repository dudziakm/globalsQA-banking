  test-webkit:
    name: 'WebKit Tests'
    runs-on: ubuntu-latest
    # 15 minutes was not enough: the Firefox job spent the whole budget inside
    # "npx playwright install --with-deps firefox" - a download - and was killed
    # before a single test ran. Chromium and WebKit finish the same step in about
    # a minute, so the limit only ever cut off the slow browser.
    timeout-minutes: 30
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Node.js
      uses: actions/setup-node@v3
